<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mundo Pokemon</title>
  </head>
  <body>
    <header>
      <form action="#" method="get">
        <input
          type="search"
          name="nombre"
          placeholder="Filtra Pokémon por nombre ..."
          autocomplete="off"
        />
        <!-- <button type="submit" >Buscar</button> -->
      </form>
    </header>
    <main>
      <article class="container">
        <figure>
          <img src="../img/bulbasaur.png" alt="imagen de Bulbasaur" />
          <figcaption>
            <p>ID: 1</p>
            <strong>Bulbasaur</strong>
            <p>Poison</p>
            <p>Grass</p>
          </figcaption>
        </figure>
      </article>

      <article class="container">
        <figure>
          <img src="../img/ivisaur.png" alt="imagen de Ivysaur" />
          <figcaption>
            <p>ID: 2</p>
            <strong>Ivysaur</strong>
            <p>Poison</p>
            <p>Grass</p>
            <p>Evoluciona de Bulbasaur</p>
          </figcaption>
        </figure>
      </article>

      <article class="container">
        <figure>
          <img src="../img/venusaur.png" alt="imagen de Venusaur" />
          <figcaption>
            <p>ID: 3</p>
            <strong>Venusaur</strong>
            <p>Poison</p>
            <p>Grass</p>
            <p>Evoluciona de Ivysaur</p>
          </figcaption>
        </figure>
      </article>

      <article class="container">
        <figure>
          <img src="../img/charmander.png" alt="imagen de Charmander" />
          <figcaption>
            <p>ID: 4</p>
            <strong>Charmander</strong>
            <p>Fire</p>
          </figcaption>
        </figure>
      </article>

      <article class="container">
        <figure>
          <img src="../img/charmeleon.png" alt="imagen de Charmeleon" />
          <figcaption>
            <p>ID: 5</p>
            <strong>Charmeleon</strong>
            <p>Fire</p>
            <p>Evoluciona de Charmander</p>
          </figcaption>
        </figure>
      </article>

      <article class="container">
        <figure>
          <img src="../img/charizard.png" alt="imagen de Charizard" />
          <figcaption>
            <p>ID: 6</p>
            <strong>Charizard</strong>
            <p>Flying</p>
            <p>Fire</p>
            <p>Evoluciona de Charmeleon</p>
          </figcaption>
        </figure>
      </article>

      <article class="container">
        <figure>
          <img src="../img/squirtle.png" alt="imagen de Squirtle" />
          <figcaption>
            <p>ID: 7</p>
            <strong>Squirtle</strong>
            <p>Water</p>
          </figcaption>
        </figure>
      </article>

      <article class="container">
        <figure>
          <img src="../img/wartortle.png" alt="imagen de Wartortle" />
          <figcaption>
            <p>ID: 8</p>
            <strong>Wartortle</strong>
            <p>Water</p>
            <p>Evoluciona de Squirtle</p>
          </figcaption>
        </figure>
      </article>

      <article class="container">
        <figure>
          <img src="../img/blastoise.png" alt="imagen de Blastoise" />
          <figcaption>
            <p>ID: 9</p>
            <strong>Blastoise</strong>
            <p>Water</p>
            <p>Evoluciona de Wartortle</p>
          </figcaption>
        </figure>
      </article>
    </main>
  </body>
</html>
