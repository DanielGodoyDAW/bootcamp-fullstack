<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscripción a un taller técnico</title>
  </head>
  <body>
    <header></header>
    <main>
      <form action="" autocomplete="on">
        <p>
          <label for="c1">Nombre completo:</label>
          <input type="text" id="c1" name="nombre" placeholder="Nombre completo" required/>
        </p>
        <p>
          <label for="c2">Email:</label>
          <input type="email" id="c2" name="email" placeholder="Correo electrónico" required/>
        </p>
        <p>
          <label for="c6">Prefijo</label>
          <select name="prefijo" id="c6">
            <option value="1">+34</option>
            <option value="2">+1</option>
            <option value="3">+5</option>
            <option value="4">+12</option>
          </select>
          <label for="c3">Télefono: </label>
          <input
            type="tel"
            id="c3"
            name="tlf"
            placeholder="Número de teléfono"
            minlength="9"
          />
        </p>
        <p>
          <label for="c4">Fecha preferida</label>
          <input type="date" id="c4" name="fecha" />
        </p>
        <p>
        <fieldset>
            <legend>Mensaje breve</legend>
            <textarea name="textarea" id="c5" placeholder="Escribe aqui una breve reseña"></textarea>
        </fieldset>
        </p>
        <p>
          <input type="submit" id="c7" value="Enviar" />
        </p>
      </form>
    </main>
    <footer></footer>
  </body>
</html>
