<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear cuenta de alumno</title>
  </head>
  <body>
    <main>
      <form action="">
        <p>
          <label for="c1">Nombre de Usuario: </label>
          <input
            type="text"
            id="c1"
            name="user"
            placeholder="Nombre de Usuario"
            required
            pattern="^[a-zA-Z0-9_]{3,20}$"
            minlength="3"
            maxlength="20"
          />
        </p>
        <p>
          <label for="c2">Email: </label>
          <input
            type="email"
            id="c2"
            name="email"
            placeholder="Correo electronico"
            required
          />
        </p>
        <p>
          <label for="c3">Contraseña: </label>
          <input
            type="password"
            id="c3"
            name="password"
            placeholder="Contraseña"
            required
            minlength="8"
            maxlength="20"
            title="La contraseña debe tener entre 8 y 20 caracteres"
          />
        </p>
        <p>
          <label for="c4">Edad: </label>
          <input type="number" id="c4" name="age" placeholder="Edad" min="0" />
        </p>
        <p>
          <label for="c5">Perfil profesional</label>
          <input
            type="url"
            id="c5"
            name="profile"
            placeholder="URL del perfil profesional"
          />
        </p>
        <p>
          <input type="checkbox" id="c6" name="terms" required />
          <label for="c6">Aceptar las condiciones de uso</label>
        </p>
        <p>
          <input type="submit" value="Crear cuenta" />
        </p>
      </form>
    </main>
  </body>
</html>
