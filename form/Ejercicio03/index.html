<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de plaza en el bootcamp</title>
</head>
<body>
    <main>
        <form action="">
            <p>
                <label for="c1">Nombre Completo: </label>
                <input type="text" id="c1" name="nombre" 
                placeholder="Escribe tu nombre completo"
                aria-describedby="descripcion"
                minlength="3">
            </p>
            <p id="descripcion">El nombre debe tener minimo 3 caracteres</p>
            <p>
                <label for="c2">Correo electronico: </label>
                <input type="email" id="c2" name="correo" placeholder="Escribe tu correo electronico">
            </p>
            <p>
                <label for="c3">Elige tu modalidad</label>
                <select name="modalidad" id="c3">
                    <option value="presencial">Presencial</option>
                    <option value="online">Online</option>
                    <option value="semi">Semi-Presencial</option>
                </select>
            </p>
            <p>
                <fieldset>
                    <legend>Marca tus intereses</legend>
                    <p>
                        <label for="c4">Programación y desarrollo web</label>
                        <input type="checkbox" id="c4" name="intereses" value="programacion">
                    </p>
                    <p>
                        <label for="c5">Ciberseguridad</label>
                        <input type="checkbox" id="c5" name="intereses" value="ciberseguridad">
                    </p>
                    <p>
                        <label for="c6">Diseño UX/UI</label>
                        <input type="checkbox" id="c6" name="intereses" value="diseño">
                    </p>
                </fieldset>
            </p>
            <fieldset>
                <legend>Conozcamos mas de ti</legend>
                <textarea name="motivacion" id="c7"></textarea>
            </fieldset>
             <p>
                <button type="submit" id="c8" value="Enviar">Enviar</button>
            </p>
        </form>
    </main>
</body>
</html>
