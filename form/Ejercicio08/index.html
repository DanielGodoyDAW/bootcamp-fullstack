<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de progreso del alumno</title>
  </head>
  <body>
    <main>
      <section>
        <p>
          <label for="c1">Modulo de HTML</label>
          <progress id="c1" value="40" max="100">40%</progress>
        </p>
        <p>
          <label for="c2">Proyecto Final</label>
          <progress id="c2" value="5" max="100">5%</progress>
        </p>
        <p>
          <label for="c3">Asistencia</label>
          <meter
            id="c3"
            min="0"
            max="1"
            value="0.85"
            low="0.6"
            high="0.8"
            optimum="1"
          >
            85%
          </meter>
          <span>85%</span>
        </p>
        <p>
          <label for="c4">Nivel de energia</label>
          <meter
            id="c4"
            min="0"
            max="10"
            value="6"
            low="3"
            high="7"
            optimum="8"
          >
            6/10
          </meter>
          <span>6/10</span>
        </p>
      </section>
    </main>
  </body>
</html>
