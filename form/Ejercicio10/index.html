<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario</title>
  </head>
  <body>
    <form>
      <p>
        <label for="c1">Nombre: </label>
        <input type="text" id="c1" name="nombre" required placeholder="Nombre"/>
      </p>
      <p>
        <label for="c2">Correo:</label>
        <input type="email" id="c2" name="email" required placeholder="Email">
      </p>
      <p>
        <label for="c3">Password:</label>
        <input type="password" id="c3" name="pass" required minlength="8" maxlength="20" title="La contraseña debe tener entre 8 y 20 caracteres">
      </p>
      <p>
        <label for="c4">Edad:</label>
        <input type="number" id="c4" name="edad" min="0" max="120">
      </p>
      <p>
        <label for="c5">Web:</label>
        <input type="url" id="c5" name="web" placeholder="https://ejemplo.com">
      </p>
      <p>
          <input type="checkbox" id="c6" name="terms" required />
          <label for="c6">Aceptar las condiciones de uso</label>
        </p>
      <button type="submit">Enviar</button>
    </form>
  </body>
</html>
