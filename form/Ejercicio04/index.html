<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscador de cursos</title>
  </head>
  <body>
    <main>
      <form action="" method="get">
        <p>
          <label for="c1">Palabra clave: </label>
          <input type="search" id="c1" name="clave"/>
        </p>
        <p>
          <label for="categoria">Categoría:</label>
          <select id="categoria" name="categoria">
            <option value="">Cualquier categoría</option>
            <option value="frontend">Desarrollo Web (Front-end)</option>
            <option value="backend">Desarrollo Web (Back-end)</option>
            <option value="fullstack">Full Stack</option>
            <option value="bbdd">Bases de datos</option>
            <option value="ciberseguridad">Ciberseguridad</option>
          </select>
        </p>
        <p>
          <label for="c5">Duracion máxima: </label>
          <input type="number" id="c5" name="duracion" min="1"/>
        </p>
        <p>
          <label for="c6">Fecha de inicio: </label>
          <input type="date" id="c6" name="fecha"/>
        </p>
        <p>
          <label for="c7">Modalidad: </label>
          <select name="modalidad" id="c7">
            <option value="">Cualquier modalidad</option>
            <option value="presencial">Presencial</option>
            <option value="online">Online</option>
            <option value="semi">Semi-Presencial</option>
          </select>
        </p>
        <p>
          <input type="submit" value="Enviar" />
        </p>
      </form>
    </main>
  </body>
</html>
