<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pseudo-clases</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Servicios</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <button type="submit">Enviar</button>
            <button type="reset">Reset</button>
        </section>
        <section>
            <ol>
                <li>elemento 1</li>
                <li>elemento 2</li>
                <li>elemento 3</li>
                <li>elemento 4</li>
                <li>elemento 5</li>
            </ol>
        </section>
        <section>
            <form action="">
                <p>
                    <label for="c1">Nombre:</label>
                    <input type="text" id="c1" name="nombre">
                </p>
                <p>
                    <label for="c2">Aceptame</label>
                    <input type="checkbox" name="licencia" id="c2">
                </p>
                <p>
                    <label for="c3"></label>
                    <input type="reset" name="desactivado" id="c3" disabled>
                </p>
            </form>
        </section>
    </main>
</body>
</html>
